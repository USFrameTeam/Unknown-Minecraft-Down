name: Release

# 构建并发布 Windows / Linux 安装包到 GitHub Releases。
# 触发：推送 v* 标签，或在 Actions 页面手动指定标签运行。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v0.2.0，需已存在对应代码）"
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建发布 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 计算发布标签
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并上传 Release 资产
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Unknown Minecraft Down ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            Minecraft Java 版下载器（原版 / Fabric / Forge，断点续传 + SHA-1 校验 + 多目录管理）。

            **产物说明**
            - Windows：`.exe`（NSIS 安装器）/ `.msi`
            - Linux：`.deb` / `.rpm` / `.AppImage`（x86_64）
            - 附件含各平台产物与 `.sig` 签名文件（如启用签名）

            > ⚠️ 本下载器仅作为备用方案，专注于游戏文件的纯净下载与目录构建。
            > 完整启动器功能请使用官方启动器或非中国大陆区的第三方启动器。
          releaseDraft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
